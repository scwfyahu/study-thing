name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build frontend + exe + bundle
        run: powershell -ExecutionPolicy Bypass -File windows/build.ps1
      - name: Verify bundle contents (frontend must be inside the exe)
        shell: pwsh
        run: |
          python -m PyInstaller.utils.cliutils.archive_viewer -l dist/StudyThing.exe | Select-String -Pattern "frontend/dist/index.html"
          if ($LASTEXITCODE -ne 0) { Write-Error "frontend/dist/index.html NOT inside StudyThing.exe"; exit 1 }
          $tmp = "$PWD/verify-zip"; Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Expand-Archive -Force StudyThing-windows.zip $tmp
          $must = @('StudyThing.exe', 'bin/ffmpeg.exe', 'bin/whisper-cli.exe',
                    'bin/ggml-large-v3-turbo-q5_0.bin')
          $missing = $must | Where-Object { -not (Test-Path (Join-Path $tmp $_)) }
          if ($missing) { Write-Error "bundle missing: $($missing -join ', ')"; exit 1 }
          Write-Host 'bundle verified: frontend packed inside exe + all bundle files present'
      - uses: actions/upload-artifact@v4
        with:
          name: StudyThing-windows
          path: StudyThing-windows.zip
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: StudyThing-windows.zip
